[package]
name = "daimonion-recorder"
version = "0.4.3"
edition = "2021"
description = "Pure-Rust recorder orchestration for the screenpipe SDK — screen + MP4 + event-driven paired capture. Consumed by both the napi addon (ee/sdk) and the Tauri plugin (ee/sdk/tauri/rust) so neither has to spawn a Node bridge."
license = "LicenseRef-Screenpipe-Enterprise"
publish = false

[dependencies]
daimonion-screen  = { path = "../../../crates/daimonion-screen" }
daimonion-core    = { path = "../../../crates/daimonion-core", default-features = false }
daimonion-a11y    = { path = "../../../crates/daimonion-a11y", default-features = false }
daimonion-capture = { path = "../../../crates/daimonion-capture" }
daimonion-db      = { path = "../../../crates/daimonion-db" }
daimonion-config  = { path = "../../../crates/daimonion-config" }

anyhow = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = "0.5"
image = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
cpal = { git = "https://github.com/screenpipe/cpal.git", rev = "01b68e60c80a59bbc1cac3629e725cf3bb2e4901" }

[dev-dependencies]
chrono = { workspace = true }
