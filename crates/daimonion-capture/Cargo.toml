[package]
name = "daimonion-capture"
version = "0.1.0"
edition = "2021"
description = "Paired screenshot + accessibility-tree capture, persisted to the screenpipe DB. Shared by the engine binary and the SDK."
license-file = { workspace = true }

[dependencies]
daimonion-a11y = { path = "../daimonion-a11y" }
daimonion-core = { path = "../daimonion-core", default-features = false, features = ["security"] }
daimonion-db = { path = "../daimonion-db" }
daimonion-screen = { path = "../daimonion-screen" }

anyhow = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
